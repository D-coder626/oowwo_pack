[commands]
	#Who may use /possess, /release and /save:
	#  1 = OPs only
	#  2 = item-only (commands OP-only; transformation items remain usable by everyone)
	#  3 = any player
	#Server-run flows are unaffected: console, command blocks and transformation items
	#keep working regardless of this setting.
	# Default: 3
	# Range: 1 ~ 3
	commandPermissionMode = 1

[species]
	#Species players may possess / play as.
	#All ids: nightfury, deadlynadder, monstrousnightmare, gronckle, hiddeous_zippleback, skrill, whispering_death, terrible_terror, speed_stinger
	enabledSpecies = ["terrible_terror"]

[gameplay]
	#The rider's hearts mirror the dragon's health, damage aimed at the hidden
	#rider is transferred to the body, and the two die together.
	sharedHealth = true
	#A dragon born from a Phylactery of Shadows is the player's body: /release on it
	#is refused for everyone but OPs. The phylactery itself is the only way back.
	phylacteryBodiesPermanent = true

[lives]
	#Give each dragon species a limited number of lives per 'run'. When the last
	#life is spent the dragon is gone: the player cannot take that species' form
	#again until they play a different species.
	livesEnabled = false
	#Announce dragon players' deaths (and remaining lives) in chat for everyone.
	announceDragonDeaths = true
	# Default: 1
	# Range: 1 ~ 10000
	nightfury = 1
	# Default: 5
	# Range: 1 ~ 10000
	deadlynadder = 5
	# Default: 5
	# Range: 1 ~ 10000
	monstrousnightmare = 5
	# Default: 15
	# Range: 1 ~ 10000
	gronckle = 15
	# Default: 10
	# Range: 1 ~ 10000
	hiddeous_zippleback = 10
	# Default: 3
	# Range: 1 ~ 10000
	skrill = 3
	# Default: 8
	# Range: 1 ~ 10000
	whispering_death = 8
	# Default: 20
	# Range: 1 ~ 10000
	terrible_terror = 20
	# Default: 6
	# Range: 1 ~ 10000
	speed_stinger = 6

[digging]
	#Whether possessed dragons can dig/mine terrain (independent of the mobGriefing gamerule).
	dragonDigging = false
	#Highest tool tier dragons dig at: wood, stone, iron, diamond, gold, netherite.
	digTier = "iron"
	#Dug blocks go straight into the possessing player's inventory
	#(overflow drops on the ground as usual).
	digDropsToInventory = true
	#Scales how much digging tires the dragon (hunger/exhaustion drain).
	#1.0 = default. Raise it to make big excavations genuinely costly.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	digHungerMultiplier = 1.0
	#Largest tunnel size players may cycle to with the dig-size key:
	#1 (single block), 3, 5, 7 or 9. Odd values only.
	# Default: 9
	# Range: 1 ~ 9
	maxBoreDiameter = 9
	#Gronckles eat rocks: whatever they dig passes through the smelting
	#recipe if one exists (cobble->stone, iron ore->ingot, sand->glass...).
	gronckleAutoSmelt = true

	#Per-species dig profiles. boreRadius is the spherical tunnel radius in
	#blocks: 1.5 bores a rounded 3-wide/3-high tunnel, 2.1 a ~5-wide one.
	#cooldownTicks is how long the dig key must be HELD per bite (20 = 1s),
	#scaled x0.5/x1/x1.5/x2.5/x4 for single/natural/5x5/7x7/9x9 modes.
	[digging.profiles]

		[digging.profiles.nightfury]
			enabled = true
			# Default: 1.5
			# Range: 1.0 ~ 4.0
			boreRadius = 1.5
			# Default: 8
			# Range: 1 ~ 200
			cooldownTicks = 8

		[digging.profiles.deadlynadder]
			enabled = true
			# Default: 1.5
			# Range: 1.0 ~ 4.0
			boreRadius = 1.5
			# Default: 8
			# Range: 1 ~ 200
			cooldownTicks = 8

		[digging.profiles.monstrousnightmare]
			enabled = true
			# Default: 1.6
			# Range: 1.0 ~ 4.0
			boreRadius = 1.6
			# Default: 8
			# Range: 1 ~ 200
			cooldownTicks = 8

		[digging.profiles.gronckle]
			enabled = true
			# Default: 1.5
			# Range: 1.0 ~ 4.0
			boreRadius = 1.5
			# Default: 10
			# Range: 1 ~ 200
			cooldownTicks = 10

		[digging.profiles.hiddeous_zippleback]
			enabled = true
			# Default: 1.7
			# Range: 1.0 ~ 4.0
			boreRadius = 1.7
			# Default: 10
			# Range: 1 ~ 200
			cooldownTicks = 10

		[digging.profiles.skrill]
			enabled = true
			# Default: 1.5
			# Range: 1.0 ~ 4.0
			boreRadius = 1.5
			# Default: 8
			# Range: 1 ~ 200
			cooldownTicks = 8

		[digging.profiles.whispering_death]
			enabled = true
			# Default: 2.1
			# Range: 1.0 ~ 4.0
			boreRadius = 2.1
			# Default: 4
			# Range: 1 ~ 200
			cooldownTicks = 4

		[digging.profiles.terrible_terror]
			enabled = true
			# Default: 1.0
			# Range: 1.0 ~ 4.0
			boreRadius = 1.0
			# Default: 12
			# Range: 1 ~ 200
			cooldownTicks = 12

		[digging.profiles.speed_stinger]
			enabled = true
			# Default: 1.2
			# Range: 1.0 ~ 4.0
			boreRadius = 1.2
			# Default: 8
			# Range: 1 ~ 200
			cooldownTicks = 8

[phylactery]
	#A phylactery binds itself to the first soul that completes its ritual (or withdraws
	#a dragon into it). With this OFF a player may hold only ONE bound phylactery at a time:
	#binding a second while carrying the first is refused. With it ON a player may bind as
	#many as they craft - splitting their soul across every vessel.
	allowMultiplePhylacteries = false
	#Only while allowMultiplePhylacteries is on: a player carrying two or more bound
	#phylacteries hears the consequences now and then (chat flavour text, nothing more).
	soulSplitWhispers = true

[tracking]
	#How far away (in chunks) dragons stay visible to clients. Book of Dragons
	#registers its dragons with the vanilla default of 5 chunks (~80 blocks), which
	#makes them pop in and out; the Ender Dragon uses 10. Applied to all BoD and
	#possessed dragon types at server start. The server's view-distance still
	#caps the effective range.
	# Default: 12
	# Range: 5 ~ 32
	dragonTrackingRangeChunks = 12

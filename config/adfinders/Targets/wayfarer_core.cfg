# Configuration file
# oowwo: AdFinders targets for wayfarer_core ores.
# wayfarer_core places vanilla copper/iron ore blocks for its normal ore and its own
# dense_* variants for the rich ore, so only the dense_* ones are listed here for those
# metals (plain copper/iron are already covered by minecraft.cfg).
#
# TIERING (oowwo): mineral_finder is the EARLY, wayfarer-tier finder — it carries copper + tin
# only, and its recipe is retiered to pre-iron materials in kubejs/server_scripts/
# oowwo_finder_early.js. metal_finder keeps its gold recipe and the full metal list, so it stays
# the upgrade. Tin/copper appear in BOTH lists on purpose.

gem_finder {
    S:targets <
     >
}


metal_finder {
    S:targets <
        wayfarer_core:tin_ore, 0xffb9c6cc, tin
        wayfarer_core:deepslate_tin_ore, 0xffb9c6cc, tin
        wayfarer_core:dense_tin_ore, 0xffb9c6cc, tin
        wayfarer_core:dense_deepslate_tin_ore, 0xffb9c6cc, tin
        wayfarer_core:dense_copper_ore, 0xffcb5d3d, copper
        wayfarer_core:dense_deepslate_copper_ore, 0xffcb5d3d, copper
        wayfarer_core:dense_iron_ore, 0xffc9a389, iron
        wayfarer_core:dense_deepslate_iron_ore, 0xffc9a389, iron
        wayfarer_core:lead_ore, 0xff6f7d94, lead
        wayfarer_core:deepslate_lead_ore, 0xff6f7d94, lead
        wayfarer_core:dense_lead_ore, 0xff6f7d94, lead
        wayfarer_core:dense_deepslate_lead_ore, 0xff6f7d94, lead
        wayfarer_core:silver_ore, 0xffd8d8e0, silver
        wayfarer_core:deepslate_silver_ore, 0xffd8d8e0, silver
        wayfarer_core:anomalous_quicksilver_ore, 0xffa9b6c4, quicksilver
     >
}


mineral_finder {
    S:targets <
        wayfarer_core:tin_ore, 0xffb9c6cc, tin
        wayfarer_core:deepslate_tin_ore, 0xffb9c6cc, tin
        wayfarer_core:dense_tin_ore, 0xffb9c6cc, tin
        wayfarer_core:dense_deepslate_tin_ore, 0xffb9c6cc, tin
        wayfarer_core:dense_copper_ore, 0xffcb5d3d, copper
        wayfarer_core:dense_deepslate_copper_ore, 0xffcb5d3d, copper
        wayfarer_core:grume_ore, 0xff8a6b4f, grume
     >
}


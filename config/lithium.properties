# By default, this file will be empty except for this notice.

# oowwo 2026-10-02: Lithium replaces FlowingFluid.getSpread with its own version (cancels at HEAD),
# so Spelunkery's channel mixin (which hooks inside getSpread) never runs and water spills off every
# side of a channel. Turning this one optimization off restores Spelunkery channels/sluices.
mixin.block.fluid.flow=false

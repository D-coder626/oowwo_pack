#Enable this to allow the creation of a datapack in each world you make that determines the configurations for this mod. If disabled, the enchantments will still be configurable but values determining compatibility, treasure, obtainability in survival, weight and max level won't work. This only applies to singleplayer worlds
allowconfigurations = false
